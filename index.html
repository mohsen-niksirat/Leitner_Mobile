<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>لایتنر پرو — یادگیری هوشمند لغات</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   DESIGN SYSTEM — Glassmorphism + Gradients
   ═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a1a;--bg2:rgba(20,20,40,0.85);--bg3:rgba(30,30,55,0.6);
  --text:#e8e8f8;--text2:#a0a0c0;--text3:#606080;
  --accent:#7c5cfc;--accent2:#a78bfa;--accent3:#c4b5fd;
  --glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.1);
  --success:#34d399;--warning:#fbbf24;--danger:#f87171;--info:#60a5fa;
  --card:rgba(20,20,45,0.7);--card-shadow:0 8px 32px rgba(0,0,0,0.3);
  --radius:20px;--radius-sm:14px;--radius-xs:8px;
  --nav-h:68px;--safe-b:env(safe-area-inset-bottom,0px);
  --transition:0.3s cubic-bezier(.4,0,.2,1);
  --font:'Vazirmatn',system-ui,-apple-system,sans-serif;
  --glow:0 0 20px rgba(124,92,252,0.3);
  --gradient-main:linear-gradient(135deg,#7c5cfc 0%,#a78bfa 50%,#60a5fa 100%);
  --gradient-warm:linear-gradient(135deg,#f87171 0%,#fbbf24 100%);
  --gradient-cool:linear-gradient(135deg,#34d399 0%,#60a5fa 100%);
  --gradient-bg:radial-gradient(ellipse at 20% 50%,rgba(124,92,252,0.15) 0%,transparent 50%),
                 radial-gradient(ellipse at 80% 20%,rgba(96,165,250,0.1) 0%,transparent 50%),
                 radial-gradient(ellipse at 50% 80%,rgba(167,139,250,0.08) 0%,transparent 50%);
}
[data-theme="light"]{
  --bg:#f0f0f8;--bg2:rgba(255,255,255,0.85);--bg3:rgba(240,240,250,0.6);
  --text:#1a1a2e;--text2:#555570;--text3:#888899;
  --glass:rgba(255,255,255,0.7);--glass-border:rgba(200,200,230,0.4);
  --card:rgba(255,255,255,0.8);--card-shadow:0 8px 32px rgba(0,0,0,0.08);
  --gradient-bg:radial-gradient(ellipse at 20% 50%,rgba(124,92,252,0.08) 0%,transparent 50%),
                 radial-gradient(ellipse at 80% 20%,rgba(96,165,250,0.06) 0%,transparent 50%),
                 radial-gradient(ellipse at 50% 80%,rgba(167,139,250,0.05) 0%,transparent 50%);
}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  -webkit-tap-highlight-color:transparent;line-height:1.7;
  background-image:var(--gradient-bg);background-attachment:fixed}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-family:var(--font);direction:rtl}
a{color:var(--accent);text-decoration:none}

/* ═══ TOAST ═══ */
#toast-container{position:fixed;top:max(16px,env(safe-area-inset-top,16px));left:50%;
  transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--text);padding:14px 20px;border-radius:var(--radius-sm);
  box-shadow:var(--card-shadow);font-size:.875rem;font-weight:500;
  pointer-events:auto;animation:toastIn .4s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--glass-border);border-right:4px solid var(--accent)}
.toast.success{border-right-color:var(--success)}
.toast.danger{border-right-color:var(--danger)}
.toast.warning{border-right-color:var(--warning)}
@keyframes toastIn{from{opacity:0;transform:translateY(-30px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}

/* ═══ BOTTOM NAV ═══ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);background:var(--glass);backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);border-top:1px solid var(--glass-border);
  display:flex;justify-content:space-around;align-items:center;z-index:1000;
  box-shadow:0 -4px 30px rgba(0,0,0,0.2)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 14px;min-width:58px;border-radius:var(--radius-sm);transition:var(--transition);
  color:var(--text3);font-size:.6rem;font-weight:700;background:none;position:relative;
  letter-spacing:0.02em}
.nav-item.active{color:var(--accent)}
.nav-item .nav-icon{font-size:1.5rem;line-height:1;transition:var(--transition)}
.nav-item.active .nav-icon{transform:scale(1.2) translateY(-2px)}
.nav-item.active::after{content:'';position:absolute;bottom:0;width:20px;height:3px;
  background:var(--gradient-main);border-radius:2px;animation:navDot .3s ease}
@keyframes navDot{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ═══ PAGES ═══ */
.page{display:none;padding:16px;min-height:calc(100vh - var(--nav-h));
  min-height:calc(100dvh - var(--nav-h));animation:pageIn .4s ease}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ═══ GLASS CARDS ═══ */
.glass-card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;
  box-shadow:var(--card-shadow);transition:var(--transition);position:relative;overflow:hidden}
.glass-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent)}
.glass-card:active{transform:scale(0.98)}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;
  box-shadow:var(--card-shadow);margin-bottom:12px;transition:var(--transition)}
.card:active{transform:scale(.98)}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 28px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:700;
  transition:all 0.25s cubic-bezier(.4,0,.2,1);min-height:50px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.1);
  opacity:0;transition:var(--transition)}
.btn:active::after{opacity:1}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--gradient-main);color:#fff;box-shadow:0 4px 20px rgba(124,92,252,0.4)}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn-ghost{background:var(--glass);color:var(--accent);border:1px solid var(--glass-border)}
.btn-danger{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff}
.btn-sm{padding:10px 18px;font-size:.8rem;min-height:38px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.icon-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--glass);color:var(--accent);font-size:1.2rem;
  transition:var(--transition);border:1px solid var(--glass-border)}
.icon-btn:active{transform:scale(.85)}

/* ═══ FORMS ═══ */
input[type="text"],input[type="search"],input[type="number"],input[type="url"],
textarea,select{
  width:100%;padding:14px 18px;border:2px solid var(--glass-border);border-radius:var(--radius-sm);
  background:var(--glass);color:var(--text);font-size:.9rem;transition:var(--transition);
  min-height:50px;backdrop-filter:blur(10px)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 4px rgba(124,92,252,0.15),var(--glow)}
textarea{resize:vertical;min-height:100px}
.label{font-size:.8rem;font-weight:700;color:var(--text2);margin-bottom:8px;display:block;
  letter-spacing:0.02em}
.field{margin-bottom:16px}

/* ═══ BADGES ═══ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;
  border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:0.02em}
.badge-accent{background:rgba(124,92,252,0.15);color:var(--accent2)}
.badge-success{background:rgba(52,211,153,0.15);color:var(--success)}
.badge-warning{background:rgba(251,191,36,0.15);color:var(--warning)}
.badge-danger{background:rgba(248,113,113,0.15);color:var(--danger)}
.badge-premium{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a2e}

/* ═══ SECTION TITLE ═══ */
.section-title{font-size:1rem;font-weight:800;margin-bottom:14px;display:flex;
  align-items:center;gap:10px;letter-spacing:0.01em}
.section-title .st-icon{font-size:1.2rem}

/* ═══ EMPTY STATE ═══ */
.empty-state{text-align:center;padding:50px 24px;color:var(--text3)}
.empty-state .empty-icon{font-size:4rem;margin-bottom:20px;display:block;
  filter:grayscale(0.3)}
.empty-state h3{color:var(--text);font-size:1.15rem;margin-bottom:10px;font-weight:700}
.empty-state p{font-size:.85rem;margin-bottom:24px;line-height:1.8}

/* ═══ BOTTOM SHEET ═══ */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s ease}
.sheet-overlay.show{opacity:1;pointer-events:auto}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;max-height:85vh;
  background:var(--bg2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:var(--radius) var(--radius) 0 0;z-index:2001;
  transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);
  overflow-y:auto;padding:24px 20px calc(24px + var(--safe-b));
  border-top:1px solid var(--glass-border)}
.bottom-sheet.show{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--text3);
  opacity:0.3;margin:0 auto 16px}

/* ═══════════════════════════════════════════
   HOME PAGE
   ═══════════════════════════════════════════ */
.hero-section{text-align:center;padding:20px 0 24px;position:relative}
.hero-greeting{font-size:.85rem;color:var(--text2);margin-bottom:4px}
.hero-title{font-size:1.6rem;font-weight:900;
  background:var(--gradient-main);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;line-height:1.4}
.hero-subtitle{font-size:.8rem;color:var(--text3);margin-top:6px}

/* Streak */
.streak-container{display:flex;align-items:center;justify-content:center;gap:10px;
  margin:16px 0}
.streak-flame{font-size:2rem;animation:flamePulse 2s ease-in-out infinite}
@keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.streak-info{text-align:right}
.streak-count{font-size:1.8rem;font-weight:900;
  background:var(--gradient-warm);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.streak-label{font-size:.7rem;color:var(--text3);font-weight:600}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;
  text-align:center;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(124,92,252,0.05) 0%,transparent 60%);pointer-events:none}
.stat-card .stat-icon{font-size:1.6rem;margin-bottom:6px;display:block}
.stat-card .stat-value{font-size:1.6rem;font-weight:900;color:var(--accent)}
.stat-card .stat-label{font-size:.7rem;color:var(--text3);margin-top:4px;font-weight:600}

/* Word of the Day */
.wotd-card{background:var(--gradient-main);border-radius:var(--radius);padding:22px;
  color:#fff;margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:0 8px 30px rgba(124,92,252,0.3)}
.wotd-card::before{content:'';position:absolute;top:-30%;right:-20%;width:200px;height:200px;
  background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);pointer-events:none}
.wotd-card::after{content:'✨';position:absolute;left:18px;top:50%;transform:translateY(-50%);
  font-size:3.5rem;opacity:0.15;pointer-events:none}
.wotd-label{font-size:.7rem;opacity:0.8;font-weight:600;letter-spacing:0.05em;
  text-transform:uppercase;margin-bottom:8px}
.wotd-word{font-size:1.8rem;font-weight:900;margin-bottom:4px}
.wotd-phonetic{font-size:.8rem;opacity:0.7;margin-bottom:6px}
.wotd-meaning{font-size:.9rem;opacity:0.9;font-weight:500}
.wotd-tts{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;
  font-size:1rem;backdrop-filter:blur(10px)}

/* Quick Actions */
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:16px 6px;background:var(--glass);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);
  border-radius:var(--radius);font-size:.65rem;font-weight:700;color:var(--text);
  transition:var(--transition);letter-spacing:0.01em}
.quick-btn:active{transform:scale(.92)}
.quick-btn .qa-icon{font-size:1.6rem}
.quick-btn .qa-label{white-space:nowrap}

/* Daily Progress Ring */
.progress-ring-container{display:flex;justify-content:center;margin:16px 0}
.progress-ring{position:relative;width:120px;height:120px}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring-bg{fill:none;stroke:var(--glass-border);stroke-width:8}
.progress-ring-fill{fill:none;stroke:url(#progressGradient);stroke-width:8;
  stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.progress-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.progress-ring-num{font-size:1.6rem;font-weight:900;color:var(--accent)}
.progress-ring-label{font-size:.6rem;color:var(--text3);font-weight:600}

/* Recent Words */
.recent-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.recent-header h3{font-size:.95rem;font-weight:700}
.recent-header a{font-size:.75rem;color:var(--accent);font-weight:600}
.recent-list{display:flex;flex-direction:column;gap:8px}
.recent-item{display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);border-radius:var(--radius-sm);
  transition:var(--transition)}
.recent-item:active{transform:scale(.97)}
.recent-word{font-weight:700;font-size:.95rem;flex:1}
.recent-trans{color:var(--text2);font-size:.8rem;flex:1;text-align:left}
.box-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ═══════════════════════════════════════════
   REVIEW PAGE
   ═══════════════════════════════════════════ */
.review-header{text-align:center;margin-bottom:16px}
.review-progress{height:6px;background:var(--glass-border);border-radius:3px;
  margin-bottom:10px;overflow:hidden}
.review-progress-bar{height:100%;background:var(--gradient-main);border-radius:3px;
  transition:width .6s cubic-bezier(.4,0,.2,1)}
.review-count{font-size:.8rem;color:var(--text2);font-weight:600}
.card-container{perspective:1200px;margin:0 auto;max-width:400px;min-height:340px}
.flip-card{width:100%;min-height:340px;position:relative;transform-style:preserve-3d;
  transition:transform 0.7s cubic-bezier(.4,0,.2,1);cursor:pointer}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  box-shadow:var(--card-shadow);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px;text-align:center}
.flip-back{transform:rotateY(180deg)}
.flip-word{font-size:2rem;font-weight:900;margin-bottom:8px;
  background:var(--gradient-main);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.flip-phonetic{color:var(--text3);font-size:.9rem;margin-bottom:10px}
.flip-pos{font-size:.75rem;color:var(--accent2);margin-bottom:10px;
  padding:3px 12px;background:var(--glass);border-radius:12px}
.flip-meaning{font-size:1.3rem;font-weight:700;color:var(--accent);margin-bottom:12px}
.flip-example{font-size:.82rem;color:var(--text2);font-style:italic;
  padding:10px 14px;background:var(--glass);border-radius:var(--radius-xs);
  margin-top:10px;max-width:100%;line-height:1.7;border-right:3px solid var(--accent)}
.flip-tts{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;
  background:var(--glass);color:var(--accent);display:flex;align-items:center;
  justify-content:center;font-size:1.1rem;z-index:2;border:1px solid var(--glass-border)}
.flip-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}

/* Rating Buttons */
.rating-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.rate-btn{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:14px 8px;border-radius:var(--radius-sm);font-weight:700;font-size:.72rem;
  transition:var(--transition);border:1px solid var(--glass-border)}
.rate-btn:active{transform:scale(.9)}
.rate-again{background:rgba(248,113,113,0.1);color:var(--danger)}
.rate-hard{background:rgba(251,191,36,0.1);color:var(--warning)}
.rate-good{background:rgba(52,211,153,0.1);color:var(--success)}
.rate-easy{background:rgba(96,165,250,0.1);color:var(--info)}
.rate-emoji{font-size:1.4rem}

/* Review Done */
.review-done{text-align:center;padding:50px 20px}
.review-done .done-icon{font-size:5rem;margin-bottom:20px;display:block;
  animation:donePop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes donePop{from{transform:scale(0)}to{transform:scale(1)}}
.review-done h2{font-size:1.4rem;font-weight:800;margin-bottom:10px}
.review-done p{color:var(--text2);font-size:.85rem}
.review-done .done-stats{display:flex;justify-content:center;gap:28px;margin:24px 0}
.review-done .done-stat{text-align:center}
.review-done .done-stat .num{font-size:1.6rem;font-weight:900;color:var(--accent)}
.review-done .done-stat .lbl{font-size:.7rem;color:var(--text3);font-weight:600}

/* ═══════════════════════════════════════════
   QUIZ PAGE
   ═══════════════════════════════════════════ */
.quiz-type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quiz-type-card{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;
  text-align:center;transition:var(--transition);position:relative;overflow:hidden}
.quiz-type-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--gradient-main);opacity:0;transition:var(--transition)}
.quiz-type-card:active{transform:scale(.95)}
.quiz-type-card:hover::before{opacity:1}
.quiz-type-card .qt-icon{font-size:2.2rem;margin-bottom:10px;display:block}
.quiz-type-card .qt-name{font-weight:700;font-size:.85rem}
.quiz-type-card .qt-desc{font-size:.7rem;color:var(--text3);margin-top:6px;line-height:1.5}
.quiz-type-card.locked{opacity:.6}
.quiz-type-card .lock-badge{position:absolute;top:10px;left:10px;font-size:1rem}
.quiz-type-card .premium-badge{position:absolute;top:10px;right:10px}

.quiz-question{text-align:center;margin-bottom:20px}
.quiz-question h2{font-size:1rem;font-weight:700;margin-bottom:6px;color:var(--text2)}
.quiz-question .quiz-word{font-size:1.8rem;font-weight:900;

<script>
/* ═══════════════════════════════════════════

   ═══════════════════════════════════════════ */
const APP_VERSION = '2.0.0';
const SCHEMA_VERSION = 2;
const FREE_LIMIT = 999999; // بدون محدودیت - رایگان
const BOX_COLORS = [
  'rgba(124,92,252,0.15)','#7c5cfc','#6d5ce7','#5b4cdb','#4a3ccc',
  '#392dbb','#281eaa','#1717999','#0606888','#7c5cfc','#fbbf24'
];
const MS_PER_DAY = 86400000;

// FSRS Parameters
const FSRS_W = [0.4,0.6,2.4,5.8,4.93,0.94,0.86,0.01,1.49,0.14,0.94,2.18,0.05,0.34,1.26,0.29,2.61];
const FSRS_DECAY_COEFF = -0.5;
const FSRS_RETENTION = 0.9;
const FSRS_MAX_INTERVAL = 365;

let state = {
  words: [],
  longTerm: [],
  currentPage: 'home',
  theme: 'dark',
  streak: 0,
  lastStudyDate: null,
  dailyReviews: 0,
  isPremium: false,
  reviewQueue: [],
  reviewIndex: 0,
  reviewResults: { correct: 0, wrong: 0, total: 0 },
  selectedWords: new Set(),
  categories: ['عمومی'],
  settings: {
    usUk: 'us',
    dailyGoal: 10,
    autoPlay: false,
    showIpa: true,
    showExamples: true
  },
  quizType: null,
  quizQuestions: [],
  quizIndex: 0,
  quizScore: 0,
  quizTotal: 0,
  stats: { totalReviews: 0, totalCorrect: 0 },
  quizStats: { sessions: [], totalCorrect: 0, totalWrong: 0, wordPerformance: {} },
  achievements: {},
  extractSelection: new Set()
};

/* ═══════════════════════════════════════════
   INDEXEDDB
   ═══════════════════════════════════════════ */
let db;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('leitner-pro-v2', SCHEMA_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('words')) {
        d.createObjectStore('words', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('longTerm')) {
        d.createObjectStore('longTerm', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('stats')) {
        d.createObjectStore('stats', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('words', 'readonly');
    const req = tx.objectStore('words').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = e => reject(e);
  });
}

function dbGetLongTerm() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('longTerm', 'readonly');
    const req = tx.objectStore('longTerm').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = e => reject(e);
  });
}

function dbPutAll(words) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('words', 'readwrite');
    const store = tx.objectStore('words');
    words.forEach(w => store.put(w));
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function dbPut(word) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('words', 'readwrite');
    tx.objectStore('words').put(word);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('words', 'readwrite');
    tx.objectStore('words').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function dbClear() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('words', 'readwrite');
    tx.objectStore('words').clear();
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function dbGetStat(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('stats', 'readonly');
    const req = tx.objectStore('stats').get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
    req.onerror = e => reject(e);
  });
}

function dbPutStat(key, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('stats', 'readwrite');
    tx.objectStore('stats').put({ key, value });
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

let _saveTimer;
function debouncedSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    dbPutAll(state.words).catch(() => {});
    dbPutStat('categories', state.categories);
    dbPutStat('stats', state.stats);
    dbPutStat('quizStats', state.quizStats);
    dbPutStat('settings', state.settings);
    dbPutStat('streak', state.streak);
    dbPutStat('lastStudyDate', state.lastStudyDate);
    // Auto-sync to Google Drive after save
    if (typeof GDriveSync !== 'undefined' && GDriveSync.isConnected) {
      GDriveSync.scheduleAutoSync();
    }
  }, 500);
}

/* ═══════════════════════════════════════════
   CARD SANITIZER
   ═══════════════════════════════════════════ */
function sanitizeCard(c) {
  if (!c || typeof c !== 'object') return null;
  return {
    id: c.id || uid(),
    word: String(c.word || '').trim(),
    translation: String(c.translation || '').trim(),
    ipa: String(c.ipa || '').trim(),
    category: String(c.category || 'عمومی').trim(),
    favorite: !!c.favorite,
    context: String(c.context || '').trim(),
    box: Math.max(0, Math.min(10, Number(c.box) || 0)),
    repetitions: Math.max(0, Number(c.repetitions) || 0),
    interval: Math.max(1, Number(c.interval) || 1),
    easeFactor: Math.max(1.3, Number(c.easeFactor) || 2.5),
    addedDate: c.addedDate || new Date().toISOString(),
    nextReviewDate: c.nextReviewDate || null,
    lastReviewedAt: c.lastReviewedAt || null,
    stability: Number(c.stability) || 0,
    difficulty: Number(c.difficulty) || 0,
    elapsedDays: Number(c.elapsedDays) || 0,
    scheduledDays: Number(c.scheduledDays) || 0,
    reps: Number(c.reps) || 0,
    lapses: Number(c.lapses) || 0,
    fsrsState: String(c.fsrsState || 'new'),
    definitions: Array.isArray(c.definitions) ? c.definitions : [],
    examples: Array.isArray(c.examples) ? c.examples : [],
    synonyms: Array.isArray(c.synonyms) ? c.synonyms : [],
    partOfSpeech: String(c.partOfSpeech || '').trim(),
    audioUs: String(c.audioUs || '').trim(),
    audioBr: String(c.audioBr || '').trim(),
    coreMeaning: String(c.coreMeaning || '').trim(),
    collocations: Array.isArray(c.collocations) ? c.collocations : [],
    antonyms: Array.isArray(c.antonyms) ? c.antonyms : [],
    wordFamily: Array.isArray(c.wordFamily) ? c.wordFamily : [],
    note: String(c.note || '').trim(),
    trap: String(c.trap || '').trim(),
    tags: Array.isArray(c.tags) ? c.tags : [],
    source: String(c.source || '').trim()
  };
}

function createCard(overrides) {
  return sanitizeCard(Object.assign({
    id: uid(), word: '', translation: '', ipa: '', category: 'عمومی',
    favorite: false, context: '',
    box: 0, repetitions: 0, interval: 1, easeFactor: 2.5,
    addedDate: new Date().toISOString(), nextReviewDate: null, lastReviewedAt: null,
    stability: 0, difficulty: 0, elapsedDays: 0, scheduledDays: 0,
    reps: 0, lapses: 0, fsrsState: 'new',
    definitions: [], examples: [], synonyms: [], partOfSpeech: '',
    audioUs: '', audioBr: '',
    coreMeaning: '', collocations: [], antonyms: [], wordFamily: [],
    note: '', trap: '', tags: [], source: ''
  }, overrides || {}));
}

function uid() {
  return 'w_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

/* ═══════════════════════════════════════════
   FSRS ALGORITHM
   ═══════════════════════════════════════════ */
function fsrsInitialDifficulty(rating) {
  return Math.min(Math.max(FSRS_W[4] - Math.exp(rating * FSRS_W[5]) + 1, 1), 10);
}

function fsrsShortTermStability(stability, rating) {
  return stability * (Math.exp(FSRS_W[8]) * (11 - 9) * Math.pow(stability, -FSRS_W[9]) * (Math.exp(FSRS_W[10] * (1 - 0.9)) - 1) + 1);
}

function fsrsRetrieveProbability(stability, elapsed) {
  return Math.pow(1 + FSRS_DECAY_COEFF * elapsed / stability, -1);
}

function fuzzInterval(interval) {
  if (interval <= 2) return interval;
  const fuzz = Math.max(1, Math.round(interval * 0.05));
  return interval + Math.floor(Math.random() * (fuzz * 2 + 1)) - fuzz;
}

function fsrsNext(w, rating) {
  const state = w.fsrsState || 'new';
  const now = new Date();
  let newStability, newDifficulty, newInterval, newState, newLapses = w.lapses || 0;

  if (state === 'new' || state === 'learning') {
    if (rating === 1) {
      newStability = Math.max(FSRS_W[0], 0.1);
      newDifficulty = fsrsInitialDifficulty(rating);
      newInterval = 0; newState = 'learning';
    } else if (rating === 2) {
      newStability = Math.max(FSRS_W[1] * 1.2, 0.2);
      newDifficulty = fsrsInitialDifficulty(rating);
      newInterval = 1; newState = 'review';
    } else if (rating === 3) {
      newStability = Math.max(fsrsShortTermStability(FSRS_W[2], rating), 0.5);
      newDifficulty = fsrsInitialDifficulty(rating);
      newInterval = Math.max(1, Math.round(FSRS_W[2]));
      newState = 'review';
    } else {
      newStability = Math.max(FSRS_W[3], 1);
      newDifficulty = fsrsInitialDifficulty(rating);
      newInterval = Math.max(1, Math.round(FSRS_W[3]));
      newState = 'review';
    }
  } else if (state === 'review') {
    const elapsed = w.elapsedDays || 0;
    const retrievability = fsrsRetrieveProbability(w.stability, Math.max(elapsed, 0));
    const difficultyDelta = -FSRS_W[6] * (rating - 3);
    newDifficulty = Math.min(Math.max(w.difficulty + difficultyDelta, 1), 10);
    const initialD = fsrsInitialDifficulty(rating);
    newDifficulty = newDifficulty + FSRS_W[13] * (initialD - newDifficulty);

    if (rating === 1) {
      newLapses = (w.lapses || 0) + 1;
      const lapseStability = FSRS_W[11] * Math.pow(newDifficulty, -FSRS_W[12]) *
        (Math.pow(w.stability + 1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14] * (1 - retrievability));
      newStability = Math.max(lapseStability, 0.1);
      newInterval = 1; newState = 'relearning';
    } else {
      const hardPenalty = rating === 2 ? FSRS_W[15] : 1;
      const easyBonus = rating === 4 ? FSRS_W[16] : 1;
      const stabilityGrowth = 1 + Math.exp(FSRS_W[7]) * (11 - newDifficulty) *
        Math.pow(w.stability, -FSRS_W[8]) * (Math.exp(FSRS_W[10] * (1 - retrievability)) - 1) *
        hardPenalty * easyBonus;
      newStability = Math.max(w.stability * stabilityGrowth, 0.1);
      if (rating === 2) newInterval = Math.max(1, Math.round(w.interval * 1.2));
      else if (rating === 3) newInterval = Math.max(1, Math.round(newStability * FSRS_DECAY_COEFF * Math.log(FSRS_RETENTION) / Math.log(0.9)));
      else newInterval = Math.max(1, Math.round(newStability * FSRS_DECAY_COEFF * 1.3));
      newState = 'review';
    }
  } else if (state === 'relearning') {
    if (rating === 1) {
      newStability = Math.max(FSRS_W[0], 0.1);
      newInterval = 1; newState = 'relearning';
    } else {
      newStability = Math.max(w.stability || FSRS_W[0], 0.1);
      newDifficulty = w.difficulty || fsrsInitialDifficulty(rating);
      newInterval = 1; newState = 'review';
      newLapses = w.lapses || 0;
    }
  } else {
    newStability = Math.max(FSRS_W[0], 0.1);
    newDifficulty = fsrsInitialDifficulty(rating);
    newInterval = 1; newState = 'learning'; newLapses = 0;
  }

  newStability = Math.max(newStability, 0.1);
  newInterval = Math.min(Math.max(Math.round(newInterval), 0), FSRS_MAX_INTERVAL);
  if (newInterval === 0) newInterval = 1;
  newInterval = fuzzInterval(newInterval);

  w.stability = newStability; w.difficulty = newDifficulty;
  w.interval = newInterval; w.fsrsState = newState; w.lapses = newLapses;
  w.reps = (w.reps || 0) + 1; w.elapsedDays = 0; w.scheduledDays = newInterval;
  w.nextReviewDate = new Date(now.getTime() + newInterval * MS_PER_DAY).toISOString();
  w.lastReviewedAt = now.toISOString();
  w.box = Math.min(10, Math.ceil(newStability / 30));
  w.easeFactor = Math.max(1.3, 3 - newDifficulty / 5);
  w.repetitions = (w.repetitions || 0) + 1;
  return w;
}

/* ═══════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════ */
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatNum(n) {
  if (n === undefined || n === null) return '۰';
  return Number(n).toLocaleString('fa-IR');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toast(msg, type = 'info', duration = 3000) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut .3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

function showConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#7c5cfc','#f87171','#fbbf24','#34d399','#60a5fa','#a78bfa'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = Math.random() * 1 + 's';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

/* ═══════════════════════════════════════════
   TTS
   ═══════════════════════════════════════════ */
function speak(text, lang) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || (state.settings.usUk === 'uk' ? 'en-GB' : 'en-US');
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

/* ═══════════════════════════════════════════
   STATS
   ═══════════════════════════════════════════ */
function getStats() {
  const now = new Date();
  const total = state.words.length;
  const mastered = state.words.filter(w => w.box >= 5).length;
  const learning = state.words.filter(w => w.box > 0 && w.box < 5).length;
  const newWords = state.words.filter(w => w.box === 0).length;
  const due = state.words.filter(w => new Date(w.nextReviewDate) <= now).length;
  const favorites = state.words.filter(w => w.favorite).length;
  const totalReps = state.words.reduce((s, w) => s + (w.reps || 0), 0);
  const avgBox = total > 0 ? (state.words.reduce((s, w) => s + w.box, 0) / total).toFixed(1) : 0;
  return { total, mastered, learning, newWords, due, favorites, totalReps, avgBox };
}

function renderWotd() {
  if (state.words.length === 0) return;
  // Use date as seed for consistent daily word
  const today = new Date().toISOString().slice(0, 10);
  const seed = today.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const w = state.words[seed % state.words.length];
  document.getElementById('wotd-word').textContent = w.word;
  document.getElementById('wotd-phonetic').textContent = w.ipa || '';
  document.getElementById('wotd-meaning').textContent = w.translation;
  document.getElementById('wotd-card').onclick = () => showWordDetail(w.id);
}

function speakWotd() {
  const word = document.getElementById('wotd-word').textContent;
  if (word && word !== '—') speak(word);
}

function renderHeatmap(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const dateStr = d.toISOString().slice(0, 10);
    const reviews = state.words.filter(w =>
      w.lastReviewedAt && w.lastReviewedAt.slice(0, 10) === dateStr
    ).length;
    days.push(reviews);
  }
  const max = Math.max(1, ...days);
  container.innerHTML = days.map((count, i) => {
    const level = count === 0 ? 0 : Math.min(4, Math.ceil(count / max * 4));
    const d = new Date(Date.now() - (29 - i) * 86400000);
    return `<div class="heatmap-cell l${level}" title="${d.toLocaleDateString('fa-IR')}: ${count} مرور"></div>`;
  }).join('');
}

async function addSingleWord() {
  const word = document.getElementById('add-word').value.trim();
  const trans = document.getElementById('add-trans').value.trim();
  if (!word || !trans) { toast('کلمه و ترجمه الزامی است', 'warning'); return; }
  if (state.words.find(w => w.word.toLowerCase() === word.toLowerCase())) {
    toast('این کلمه قبلاً اضافه شده', 'warning'); return;
  }
  const newWord = createCard({
    word, translation: trans,
    ipa: document.getElementById('add-ipa').value.trim(),
    category: document.getElementById('add-cat').value.trim() || 'عمومی',
    context: document.getElementById('add-example').value.trim()
  });
  state.words.push(newWord);
  debouncedSave();
  closeSheet();
  showConfetti();
  toast(`✅ "${word}" اضافه شد`, 'success');
  renderHome();
  
  // Try to enrich
  try {
    const data = await fetchWordData(word);

    }

function addBatchWords() {
  const input = document.getElementById('batch-input').value.trim();
  if (!input) return;
  const lines = input.split('\n').filter(l => l.trim());
  let added = 0;
  for (const line of lines) {
    const parts = line.split(/[—\-|:]/).map(s => s.trim());
    if (parts.length < 2) continue;
    const [word, translation] = parts;
    if (!word || !translation) continue;
    if (state.words.find(w => w.word.toLowerCase() === word.toLowerCase())) continue;
    if (state.words.length >= FREE_LIMIT && !isPremium()) {
      toast(`⚠️ محدودیت ${formatNum(FREE_LIMIT)} لغت (رایگان)`, 'warning');
      break;
    }
    state.words.push(createCard({ word, translation, category: 'عمومی' }));
    added++;
  }
  if (added > 0) {
    debouncedSave();
    closeSheet();
    showConfetti();
    toast(`✅ ${formatNum(added)} لغت اضافه شد`, 'success');
    renderHome();
  }
}

/* ═══════════════════════════════════════════
   DICTIONARY API
   ═══════════════════════════════════════════ */
async function fetchWordData(word) {
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || !data[0]) return null;
    return data[0];
  } catch { return null; }
}

function enrichWithDictData(card, data) {
  if (!data) return;
  // Phonetics
  const phonetic = data.phonetics?.find(p => p.text) || data.phonetic;
  if (phonetic) card.ipa = phonetic.text || phonetic;
  
  // Audio
  const usAudio = data.phonetics?.find(p => p.audio?.includes('us'));
  const brAudio = data.phonetics?.find(p => p.audio?.includes('gb') || p.audio?.includes('uk'));
  if (usAudio?.audio) card.audioUs = usAudio.audio;
  if (brAudio?.audio) card.audioBr = brAudio.audio;
  if (!card.audioUs && data.phonetics?.[0]?.audio) card.audioUs = data.phonetics[0].audio;

  // Meanings
  if (data.meanings && data.meanings.length > 0) {
    card.partOfSpeech = data.meanings[0].partOfSpeech || '';
    const defs = [];
    const exs = [];
    const syns = new Set();
    const ants = new Set();
    for (const m of data.meanings) {
      for (const d of (m.definitions || [])) {
        if (d.definition) defs.push(d.definition);
        if (d.example) exs.push(d.example);
      }
      for (const s of (m.synonyms || [])) syns.add(s);
      for (const a of (m.antonyms || [])) ants.add(a);
    }
    if (defs.length > 0) card.definitions = defs.slice(0, 5);
    if (exs.length > 0) card.examples = exs.slice(0, 3);
    if (syns.size > 0) card.synonyms = [...syns].slice(0, 5);
    if (ants.size > 0) card.antonyms = [...ants].slice(0, 3);
  }
}

        <button class="btn btn-primary" onclick="navigateTo('home')">🏠 بازگشت</button>
      </div>
    `;
    return;
  }

  if (state.reviewQueue.length === 0) {
    state.reviewQueue = shuffle(dueWords).slice(0, 20);

      <div class="review-done">
        <span class="done-icon">🏆</span>
        <h2>مرور تمام شد!</h2>

          <div class="done-stat"><div class="num" style="color:var(--danger)">${formatNum(r.wrong)}</div><div class="lbl">نادرست</div></div>
        </div>
        <button class="btn btn-primary" onclick="state.reviewQueue=[];navigateTo('home')">🏠 بازگشت</button>
      </div>
    `;
    return;
  }

  const w = state.reviewQueue[i];
  const progress = ((i) / total * 100).toFixed(0);
  
  document.getElementById('review-container').innerHTML = `
    <div class="review-header">
      <div class="review-progress"><div class="review-progress-bar" style="width:${progress}%"></div></div>
      <div class="review-count">${formatNum(i + 1)} از ${formatNum(total)} — ✅ ${state.reviewResults.correct} ❌ ${state.reviewResults.wrong}</div>
    </div>
    <div class="card-container">
      <div class="flip-card" id="flip-card" onclick="document.getElementById('flip-card').classList.toggle('flipped')">
        <div class="flip-face">
          <button class="flip-tts" onclick="event.stopPropagation();speak('${escHtml(w.word)}')">🔊</button>
          <div class="flip-word">${escHtml(w.word)}</div>
          ${w.ipa && state.settings.showIpa ? `<div class="flip-phonetic">${escHtml(w.ipa)}</div>` : ''}
          ${w.partOfSpeech ? `<div class="flip-pos">${escHtml(w.partOfSpeech)}</div>` : ''}
          <div style="font-size:.8rem;color:var(--text3);margin-top:20px">برای دیدن معنی ضربه بزنید</div>
        </div>
        <div class="flip-face flip-back">
          <div class="flip-meaning">${escHtml(w.translation)}</div>
          ${w.coreMeaning ? `<div style="font-size:.85rem;color:var(--text2);margin-bottom:10px">${escHtml(w.coreMeaning)}</div>` : ''}
          ${w.definitions && w.definitions[0] ? `<div style="font-size:.82rem;color:var(--text2);margin-bottom:8px">${escHtml(w.definitions[0])}</div>` : ''}
          ${w.examples && w.examples[0] && state.settings.showExamples ? `
            <div class="flip-example">"${escHtml(w.examples[0])}"</div>
          ` : ''}
          ${w.synonyms && w.synonyms.length ? `
            <div class="flip-tags">${w.synonyms.slice(0,3).map(s => `<span class="badge badge-accent">${escHtml(s)}</span>`).join('')}</div>
          ` : ''}
        </div>
      </div>
    </div>
    <div class="rating-buttons">
      <button class="rate-btn rate-again" onclick="rateReview(1)"><span class="rate-emoji">😵</span>دوباره</button>
      <button class="rate-btn rate-hard" onclick="rateReview(2)"><span class="rate-emoji">😓</span>سخت</button>
      <button class="rate-btn rate-good" onclick="rateReview(3)"><span class="rate-emoji">😊</span>خوب</button>
      <button class="rate-btn rate-easy" onclick="rateReview(4)"><span class="rate-emoji">😎</span>آسان</button>
    </div>
  `;
}

function rateReview(rating) {
  const w = state.reviewQueue[state.reviewIndex];
  if (!w) return;
  const idx = state.words.findIndex(x => x.id === w.id);
  if (idx === -1) return;
  
  fsrsNext(state.words[idx], rating);
  
  if (rating >= 3) {
    state.reviewResults.correct++;
    state.stats.totalCorrect = (state.stats.totalCorrect || 0) + 1;
  } else {
    state.reviewResults.wrong++;
  }
  state.stats.totalReviews = (state.stats.totalReviews || 0) + 1;
  
  // Update streak
  const today = new Date().toISOString().slice(0, 10);
  if (state.lastStudyDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    if (state.lastStudyDate === yesterday) {
      state.streak++;
    } else if (state.lastStudyDate !== today) {
      state.streak = 1;
    }
    state.lastStudyDate = today;
  }
  state.dailyReviews = (state.dailyReviews || 0) + 1;
  
  debouncedSave();
  checkAchievements();
  state.reviewIndex++;
  renderReview();
}

function startQuiz(type) {
  if (state.words.length < 4) {
    toast('حداقل ۴ لغت برای آزمون نیاز است', 'warning');
    return;
  }
  state.quizType = type;
  state.quizIndex = 0;
  state.quizScore = 0;
  state.quizTotal = Math.min(10, state.words.length);
  state.quizQuestions = generateQuizQuestions(type, state.quizTotal);
  document.getElementById('quiz-select').style.display = 'none';
  document.getElementById('quiz-active').style.display = 'block';
  showQuizQuestion();
}

function generateQuizQuestions(type, count) {
  const shuffled = shuffle(state.words).slice(0, count);
  return shuffled.map(w => {
    const others = shuffle(state.words.filter(x => x.id !== w.id)).slice(0, 3);
    const options = shuffle([w, ...others]);
    return { word: w, options, correctIndex: options.findIndex(o => o.id === w.id) };
  });
}

function showQuizQuestion() {
  const q = state.quizQuestions[state.quizIndex];
  if (!q) { showQuizDone(); return; }

  document.getElementById('quiz-header').innerHTML = `
    <div class="quiz-score-bar">
      <span class="quiz-score-item">✅ ${state.quizScore}</span>
      <span class="quiz-score-item" style="color:var(--text3)">سوال ${state.quizIndex + 1} از ${state.quizTotal}</span>
    </div>
    <div class="review-progress"><div class="review-progress-bar" style="width:${(state.quizIndex / state.quizTotal * 100)}%"></div></div>
  `;
  document.getElementById('quiz-next').style.display = 'none';

  if (state.quizType === 'mc') renderMCQuiz(q);
  else if (state.quizType === 'type') renderTypeQuiz(q);
  else if (state.quizType === 'en') renderEnQuiz(q);
  else if (state.quizType === 'fill') renderFillQuiz(q);
  else if (state.quizType === 'speed') renderSpeedQuiz(q);
  else if (state.quizType === 'listen') renderListenQuiz(q);
  else if (state.quizType === 'synonym') renderSynonymQuiz(q);
  else if (state.quizType === 'antonym') renderAntonymQuiz(q);
  else if (state.quizType === 'context') renderContextQuiz(q);
  else renderMCQuiz(q);
}

function checkMCAnswer(selected, correct, el) {

let wordPage = 0;
const WORDS_PER_PAGE = 20;

function renderWords() {
  renderFilterBar();

}

function renderFilterBar() {
  const cats = ['همه', ...new Set(state.words.map(w => w.category || 'عمومی'))];
  document.getElementById('filter-bar').innerHTML = cats.map(c => `
    <button class="filter-chip ${c === 'همه' ? 'active' : ''}" 
            onclick="filterWords('${c}',this)">${c}</button>
  `).join('');
}

let wordFilter = 'همه';
function filterWords(cat, el) {
  wordFilter = cat;
  wordPage = 0;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  renderWordList();
}

function renderWordList() {
  const search = (document.getElementById('word-search')?.value || '').toLowerCase();
  let filtered = state.words;
  if (wordFilter !== 'همه') filtered = filtered.filter(w => w.category === wordFilter);
  if (search) filtered = filtered.filter(w => 
    w.word.toLowerCase().includes(search) || w.translation.includes(search));
  
  const total = filtered.length;
  const totalPages = Math.ceil(total / WORDS_PER_PAGE);
  const page = Math.min(wordPage, totalPages - 1);
  const start = page * WORDS_PER_PAGE;
  const pageWords = filtered.slice(start, start + WORDS_PER_PAGE);

  document.getElementById('word-list').innerHTML = pageWords.length ? pageWords.map(w => `
    <div class="word-item" onclick="showWordDetail('${w.id}')">
      <div class="word-box-badge" style="background:${BOX_COLORS[Math.min(10, w.box)]}">${w.box}</div>
      <div class="word-info">
        <div class="wi-word">${escHtml(w.word)}</div>
        <div class="wi-trans">${escHtml(w.translation)}</div>
        <div class="wi-meta">
          ${w.partOfSpeech ? `<span>${escHtml(w.partOfSpeech)}</span>` : ''}
          ${w.ipa ? `<span>${escHtml(w.ipa)}</span>` : ''}
          <span>${formatNum(w.reps || 0)} تکرار</span>
        </div>
      </div>
      <div class="word-actions">
        <button class="word-fav ${w.favorite ? 'active' : ''}" 
                onclick="event.stopPropagation();toggleFav('${w.id}')">
          ${w.favorite ? '❤️' : '🤍'}
        </button>
        <button class="word-tts-btn" onclick="event.stopPropagation();speak('${escHtml(w.word)}')">🔊</button>
      </div>
    </div>
  `).join('') : '<div class="empty-state"><span class="empty-icon">📭</span><p>لغتی یافت نشد</p></div>';

  // Pagination
  if (totalPages > 1) {
    let pagHtml = '';
    pagHtml += `<button ${page <= 0 ? 'disabled' : ''} onclick="wordPage=${page-1};renderWordList()">◀</button>`;
    for (let i = 0; i < totalPages; i++) {
      if (totalPages > 7 && i > 2 && i < totalPages - 2 && Math.abs(i - page) > 1) {
        if (i === 3 || i === totalPages - 3) pagHtml += '<span style="color:var(--text3)">…</span>';
        continue;
      }
      pagHtml += `<button class="${i === page ? 'active' : ''}" onclick="wordPage=${i};renderWordList()">${i + 1}</button>`;
    }
    pagHtml += `<button ${page >= totalPages - 1 ? 'disabled' : ''} onclick="wordPage=${page+1};renderWordList()">▶</button>`;
    document.getElementById('pagination').innerHTML = pagHtml;
  } else {
    document.getElementById('pagination').innerHTML = '';
  }
}

function renderExtract() {
  // Reset
  document.getElementById('extract-results-area').style.display = 'none';
  state.extractSelection = new Set();
}

function switchExtractTab(tab) {
  document.querySelectorAll('.extract-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.extract-section').forEach(s => s.style.display = 'none');
  document.getElementById(`extract-${tab}`).style.display = 'block';
}

function handleExtractFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    document.getElementById('extract-text').value = text;
    switchExtractTab('paste');
    toast('📄 فایل بارگذاری شد', 'success');
  };
  reader.readAsText(file);
}

async function startExtraction() {
  
  let text = '';
  const activeTab = document.querySelector('.extract-tab.active')?.dataset.tab || 'paste';
  
  if (activeTab === 'paste') {
    text = document.getElementById('extract-text').value.trim();
  } else if (activeTab === 'url') {
    const url = document.getElementById('extract-url-input').value.trim();
    if (!url) { toast('آدرس را وارد کنید', 'warning'); return; }
    toast('⏳ در حال دریافت...', 'info');
    try {
      // Note: CORS may block this in browser. Would need a proxy.
      const res = await fetch(url);
      const html = await res.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      text = doc.body?.innerText || '';
    } catch {
      toast('خطا در دریافت صفحه', 'danger');
      return;
    }
  }
  
  if (!text || text.length < 20) {
    toast('متن کافی نیست', 'warning');
    return;
  }

  // Extract English words
  const words = extractEnglishWords(text);
  const uniqueWords = [...new Set(words.map(w => w.toLowerCase()))];
  
  // Filter out known words and common words
  const knownSet = new Set(state.words.map(w => w.word.toLowerCase()));
  const commonWords = new Set([
    'the','a','an','is','are','was','were','be','been','being','have','has','had',
    'do','does','did','will','would','could','should','may','might','shall','can',
    'and','but','or','nor','for','yet','so','both','either','neither','not','only',
    'that','this','these','those','it','its','he','she','they','we','you','i',
    'my','your','his','her','their','our','its','me','him','them','us',
    'in','on','at','to','for','with','from','by','of','about','into','through',
    'during','before','after','above','below','between','under','over',
    'who','which','what','where','when','how','why','if','then','than',
    'very','really','quite','just','also','too','much','many','more','most',
    'some','any','no','all','each','every','few','little','own','other','another',
    'new','old','first','last','long','great','small','big','high','low',
    'good','bad','right','left','same','different','important','never','always',
    'often','sometimes','usually','here','there','now','then','today','tomorrow',
    'already','still','however','because','although','while','until','since',
    'one','two','three','four','five','six','seven','eight','nine','ten',
    'make','made','take','took','give','gave','get','got','go','went','come','came',
    'say','said','tell','told','think','thought','know','knew','see','saw',
    'want','need','try','use','find','found','work','call','ask','put','keep',
    'let','begin','seem','show','hear','play','run','move','live','believe',
    'bring','happen','must','without','between','through','against','every','being'
  ]);

  const newWords = uniqueWords.filter(w => 
    w.length >= 3 && !knownSet.has(w) && !commonWords.has(w) && /^[a-z]+$/.test(w));

  if (newWords.length === 0) {
    toast('لغت جدیدی یافت نشد', 'info');
    return;
  }

  // Show results
  document.getElementById('extract-results-area').style.display = 'block';
  
  const statsEl = document.getElementById('extract-stats');
  statsEl.innerHTML = `
    <div class="extract-stat"><div class="es-num">${formatNum(uniqueWords.length)}</div><div class="es-label">کل کلمات</div></div>
    <div class="extract-stat"><div class="es-num">${formatNum(newWords.length)}</div><div class="es-label">لغت جدید</div></div>
    <div class="extract-stat"><div class="es-num">${formatNum(knownSet.size)}</div><div class="es-label">از قبل بلدید</div></div>
  `;

  // Pre-select all
  state.extractSelection = new Set(newWords);

  const resultsEl = document.getElementById('extract-results');
  resultsEl.innerHTML = newWords.map(w => `
    <div class="extract-word-card" id="ew-${w}">
      <div class="ew-check checked" onclick="toggleExtractWord('${w}',this)">✓</div>
      <div class="ew-word">${escHtml(w)}</div>
      <div class="ew-trans" id="ewt-${w}">—</div>
    </div>
  `).join('');

  // Batch translate using dictionary API
  toast(`🔍 ${formatNum(newWords.length)} لغت جدید یافت شد`, 'success');
  
  // Enrich in background
  for (const w of newWords.slice(0, 50)) {
    try {
      const data = await fetchWordData(w);
      if (data) {
        const meaning = data.meanings?.[0]?.definitions?.[0]?.definition || '';
        const transEl = document.getElementById(`ewt-${w}`);
        if (transEl && meaning) transEl.textContent = meaning.slice(0, 60);
      }
      await new Promise(r => setTimeout(r, 200));
    } catch {}
  }
}

function extractEnglishWords(text) {
  return text.match(/[a-zA-Z]{3,}/g) || [];
}

function toggleExtractWord(word, el) {
  if (state.extractSelection.has(word)) {
    state.extractSelection.delete(word);
    el.classList.remove('checked');
    el.textContent = '';
  } else {
    state.extractSelection.add(word);
    el.classList.add('checked');
    el.textContent = '✓';
  }
}

function selectAllExtract(select) {
  const cards = document.querySelectorAll('.extract-word-card');
  cards.forEach(card => {
    const word = card.querySelector('.ew-word').textContent;
    const check = card.querySelector('.ew-check');
    if (select) {
      state.extractSelection.add(word);
      check.classList.add('checked');
      check.textContent = '✓';
    } else {
      state.extractSelection.delete(word);
      check.classList.remove('checked');
      check.textContent = '';
    }
  });
}

function addExtractedWords() {
  if (state.extractSelection.size === 0) {
    toast('هیچ لغتی انتخاب نشده', 'warning');
    return;
  }
  let added = 0;
  for (const word of state.extractSelection) {
    if (state.words.find(w => w.word.toLowerCase() === word.toLowerCase())) continue;
    if (state.words.length >= FREE_LIMIT && !isPremium()) {
      toast(`⚠️ محدودیت ${formatNum(FREE_LIMIT)} لغت`, 'warning');
      break;
    }
    state.words.push(createCard({ word, translation: '—', category: 'استخراج‌شده', source: 'extract' }));
    added++;
  }
  if (added > 0) {
    debouncedSave();
    showConfetti();
    toast(`✅ ${formatNum(added)} لغت اضافه شد`, 'success');
    renderHome();
    // Enrich in background
    const newWords = state.words.filter(w => w.source === 'extract' && w.translation === '—');
    enrichExtractedWords(newWords);
  }
}

async function enrichExtractedWords(words) {
  let count = 0;
  for (const w of words) {
    try {
      const data = await fetchWordData(w.word);
      if (data) {
        enrichWithDictData(w, data);
        if (w.translation === '—' || !w.translation) {
          // Try to get Persian translation
          w.translation = data.meanings?.[0]?.definitions?.[0]?.definition || w.word;
        }
        count++;
      }
      await new Promise(r => setTimeout(r, 300));
    } catch {}
  }
  if (count > 0) {
    debouncedSave();
    toast(`📚 ${formatNum(count)} لغت غنی‌سازی شد`, 'success');
  }
}

async function loadPack(packId) {
  const pack = PACKS.find(p => p.id === packId);

  try {
    toast('⏳ در حال دانلود...', 'info');
    const res = await fetch(pack.url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (!data.words || !Array.isArray(data.words)) {
      toast('فرمت فایل نامعتبر', 'danger');
      return;
    }
    let added = 0;
    for (const w of data.words) {
      if (state.words.find(x => x.word.toLowerCase() === w.word.toLowerCase())) continue;
      if (state.words.length >= FREE_LIMIT && !isPremium()) {
        toast(`⚠️ محدودیت ${formatNum(FREE_LIMIT)} لغت`, 'warning');
        break;
      }
      state.words.push(createCard({
        word: w.word, translation: w.translation, ipa: w.ipa || '',
        category: data.category || pack.name.split(' ').slice(1).join(' '),
        source: packId, definitions: w.definitions || [],
        examples: w.example ? [w.example] : (w.examples || []),
        partOfSpeech: w.partOfSpeech || '', synonyms: w.synonyms || [],
        coreMeaning: w.coreMeaning || '', antonyms: w.antonyms || [],
        collocations: w.collocations || [], wordFamily: w.wordFamily || [],
        note: w.note || '', trap: w.trap || ''

  } catch (err) {

function importData() {
  openSheet(`
    <h3 style="font-size:1.1rem;font-weight:800;margin-bottom:18px">📥 بازیابی اطلاعات</h3>
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:16px">فایل JSON پشتیبان را انتخاب کنید</p>
    <input type="file" id="import-file" accept=".json" style="margin-bottom:16px"
           onchange="handleImportFile(this)">
    <div id="import-preview" style="display:none;margin-bottom:16px"></div>
  `);
}

function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      const words = data.words || [];
      const longTerm = data.longTerm || [];
      if (!words.length && !longTerm.length) {
        toast('فرمت فایل نامعتبر', 'danger'); return;
      }
      document.getElementById('import-preview').style.display = 'block';
      document.getElementById('import-preview').innerHTML = `
        <div class="card" style="background:var(--glass)">
          <p>📚 ${formatNum(words.length)} لغت</p>
          ${longTerm.length ? `<p>🧠 ${formatNum(longTerm.length)} لغت حافظه بلندمدت</p>` : ''}
          <p>📅 ${data.exportedAt ? new Date(data.exportedAt).toLocaleDateString('fa-IR') : 'نامشخص'}</p>
        </div>
        <button class="btn btn-primary btn-block" onclick="confirmImport()">بازیابی</button>
      `;
      window._importData = data;
    } catch {
      toast('خطا در خواندن فایل', 'danger');
    }
  };
  reader.readAsText(file);
}

async function confirmImport() {
  const data = window._importData;
  if (!data) return;
  let imported = 0;
  const allWords = [...(data.words || []), ...(data.longTerm || [])];
  for (const w of allWords) {
    if (!state.words.find(x => x.word.toLowerCase() === w.word.toLowerCase())) {
      state.words.push(sanitizeCard(w));
      imported++;
    }
  }
  if (data.categories) {
    data.categories.forEach(c => { if (!state.categories.includes(c)) state.categories.push(c); });
  }
  if (data.settings) state.settings = { ...state.settings, ...data.settings };
  if (data.achievements) state.achievements = { ...state.achievements, ...data.achievements };
  debouncedSave();
  closeSheet();
  showConfetti();
  toast(`✅ ${formatNum(imported)} لغت بازیابی شد`, 'success');
  renderHome();
}

async function bulkEnrichWords() {
  const wordsToEnrich = state.words.filter(w => !w.definitions || w.definitions.length === 0);
  if (wordsToEnrich.length === 0) {
    toast('همه کلمات قبلاً غنی‌سازی شده‌اند', 'info');
    return;
  }
  openSheet(`
    <h3 style="font-size:1.1rem;font-weight:800;margin-bottom:18px">📚 غنی‌سازی کلمات</h3>
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:16px">
      ${formatNum(wordsToEnrich.length)} کلمه نیاز به غنی‌سازی دارد
    </p>
    <div id="enrich-progress" style="margin-bottom:16px">
      <div class="review-progress"><div class="review-progress-bar" id="enrich-bar" style="width:0%"></div></div>
      <p style="font-size:.82rem;color:var(--text2);text-align:center;margin-top:8px" id="enrich-status">در حال شروع...</p>
    </div>
    <button class="btn btn-primary btn-block" onclick="startBulkEnrich()">🚀 شروع غنی‌سازی</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeSheet()">انصراف</button>
  `);
}

async function startBulkEnrich() {
  const wordsToEnrich = state.words.filter(w => !w.definitions || w.definitions.length === 0);
  let enriched = 0, failed = 0;
  for (let i = 0; i < wordsToEnrich.length; i++) {
    const w = wordsToEnrich[i];
    const pct = Math.round(((i + 1) / wordsToEnrich.length) * 100);
    const bar = document.getElementById('enrich-bar');
    const status = document.getElementById('enrich-status');
    if (bar) bar.style.width = pct + '%';
    if (status) status.textContent = `${i + 1}/${wordsToEnrich.length} — ${w.word}`;
    try {
      const dictData = await fetchWordData(w.word);
      if (dictData) {
        enrichWithDictData(w, dictData);
        enriched++;
      } else { failed++; }
      await new Promise(r => setTimeout(r, 350));
    } catch { failed++; }
  }
  debouncedSave();
  closeSheet();
  toast(`✅ ${enriched} کلمه غنی‌سازی شد${failed ? ` (${failed} ناموفق)` : ''}`, 'success');
}

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
async function init() {
  // Theme
  const savedTheme = localStorage.getItem('leitner-theme') || 'dark';
  setTheme(savedTheme);

  // Settings
  try {
    const saved = JSON.parse(localStorage.getItem('leitner-settings'));
    if (saved) state.settings = { ...state.settings, ...saved };
  } catch {}

  // Streak
  state.streak = parseInt(localStorage.getItem('leitner-streak')) || 0;
  state.lastStudyDate = localStorage.getItem('leitner-lastStudy');

  // Premium
  state.isPremium = localStorage.getItem('leitner-premium') === 'true';

  // DB
  try {
    await openDB();
    state.words = await dbGetAll();
    state.longTerm = await dbGetLongTerm();
    const savedCategories = await dbGetStat('categories');
    if (savedCategories) state.categories = savedCategories;
    const savedStats = await dbGetStat('stats');
    if (savedStats) state.stats = { ...state.stats, ...savedStats };
    const savedQuizStats = await dbGetStat('quizStats');
    if (savedQuizStats) state.quizStats = { ...state.quizStats, ...savedQuizStats };
    const savedSettings = await dbGetStat('settings');
    if (savedSettings) state.settings = { ...state.settings, ...savedSettings };
    const savedStreak = await dbGetStat('streak');
    if (savedStreak !== undefined) state.streak = savedStreak;
    const savedLastStudy = await dbGetStat('lastStudyDate');
    if (savedLastStudy) state.lastStudyDate = savedLastStudy;
    const savedAchievements = await dbGetStat('achievements');
    if (savedAchievements) state.achievements = savedAchievements;
    const savedDaily = await dbGetStat('dailyReviews_' + new Date().toISOString().slice(0,10));
    if (savedDaily !== undefined) state.dailyReviews = savedDaily;
  } catch (e) {
    console.error('DB error:', e);
    state.words = [];
  }

  // First run
  if (state.words.length === 0) {
    state.words = getDemoWords();
    await dbPutAll(state.words);
  }

  // Save daily reviews counter
  const today = new Date().toISOString().slice(0, 10);
  dbPutStat('dailyReviews_' + today, state.dailyReviews);

  renderHome();
  
  // Service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }

  // Google Drive Sync — listen for status changes
  if (typeof GDriveSync !== 'undefined') {
    GDriveSync.onStatusChange = (status, message) => {
      if (status === 'error' || status === 'token_expired') {
        toast('❌ ' + message, 'danger');
      } else if (status === 'synced' || status === 'downloaded') {
        toast(message, 'success');
      } else if (status === 'syncing' || status === 'connecting') {
        toast('⏳ ' + message, 'warning');
      } else if (status === 'logged_in') {
        toast('✅ ' + message, 'success');
        // Auto full sync on login
        setTimeout(() => GDriveSync.fullSync(), 1000);
      } else if (status === 'logged_out') {
        toast(message, 'warning');
      }
    };
  }
}

init();
